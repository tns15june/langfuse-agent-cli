[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langfuse-agent-cli"
version = "0.1.0"
description = "Agent-native CLI and companion skills for Langfuse, built for humans and AI coding assistants."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Tarkeshwar Narayan", email = "122815908+tns15june@users.noreply.github.com" }
]
keywords = ["langfuse", "llm", "observability", "agent", "claude", "cursor", "antigravity", "skills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/tns15june/langfuse-agent-cli"
Repository = "https://github.com/tns15june/langfuse-agent-cli"
Issues = "https://github.com/tns15june/langfuse-agent-cli/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
lf = "langfuse_cli.cli:main"
langfuse-cli = "langfuse_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["langfuse_cli*", "skills*"]
