[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langfuse-agent-cli"
dynamic = ["version"]
description = "Agent-oriented CLI and skill for Langfuse traces, prompts, datasets and scores."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tarkeshwar Narayan", email = "122815908+tns15june@users.noreply.github.com" }
]
keywords = ["langfuse", "llm", "observability", "agent", "cli", "skills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/tns15june/langfuse-agent-cli"
Repository = "https://github.com/tns15june/langfuse-agent-cli"
Issues = "https://github.com/tns15june/langfuse-agent-cli/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
lf = "langfuse_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["langfuse_cli*"]

[tool.setuptools.dynamic]
version = { attr = "langfuse_cli.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
